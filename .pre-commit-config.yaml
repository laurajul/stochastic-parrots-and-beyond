# prek runs these hooks. `npm run check` is the whole gate: Prettier, ruff,
# ty, and pytest. pytest also runs the privacy guard in test/test_privacy.py.
repos:
  - repo: local
    hooks:
      - id: check
        name: Gate (npm run check)
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: commitlint
        name: Commitlint
        entry: npx commitlint --edit
        language: system
        stages: [commit-msg]
