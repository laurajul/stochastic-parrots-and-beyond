name: Attach Rendered Site to Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  QUARTO_VERSION: '1.10.19'

jobs:
  build-and-attach:
    name: Build the site and upload the release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build the site archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm run site:build && npm run site:archive -- --tag "$TAG"

      - name: Upload the release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-artifacts/site-${{ github.event.release.tag_name }}.zip
