name: 🐞 Bug
description: Report a problem with the website, the slides, the handouts, or the build
title: '<title>'
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Do not post personal data: no participant names, no attendance details, no grades, no evaluation answers, and no research data. Write to the Graduate Center (GRACE) about registration, attendance, or credits.
  - type: textarea
    attributes:
      label: Current Behavior
      description: A description of what you're experiencing.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Reproduction / Steps To Reproduce
      description: Give the page URL and the steps that show the problem.
      placeholder: |
        1. Open the page ...
        2. Click ...
        3. See the error ...
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Include the browser, the device, and, if possible, a screenshot. Remove personal data from the screenshot first.
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!
        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
