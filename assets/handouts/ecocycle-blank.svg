  <text x="344.4" y="492.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">BIRTH</text>
  <text x="344.4" y="509.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">new ideas, experiments</text>
  <text x="500.0" y="610.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">Movement: birth → maturity → creative destruction → renewal → birth.</text>
