<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Ecocycle (blank)</title>
  <desc id="desc">A figure-eight loop in A4 landscape. The movement runs: birth on the lower left loop, then maturity on the upper right loop, then the rigidity trap at the right end, then creative destruction on the lower right loop, then renewal on the upper left loop, then the scarcity trap at the left end, and back to birth. The rigidity trap lies between maturity and creative destruction. The scarcity trap lies between renewal and birth. The space inside the loops is empty for notes. Adapted from Liberating Structures (Lipmanowicz, McCandless, White; liberatingstructures.com, Fieldbook 2026). CC BY-SA 4.0.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33322f"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Ecocycle</text>
  <text x="150.0" y="34.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Place each priority initiative where it is today.</text>
