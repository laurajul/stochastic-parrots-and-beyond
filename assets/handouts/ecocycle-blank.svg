  <text x="655.6" y="492.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">CREATIVE DESTRUCTION</text>
