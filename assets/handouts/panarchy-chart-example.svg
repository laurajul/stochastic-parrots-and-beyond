  <text x="940.0" y="80.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="middle">and rules</text>
  <text x="940.0" y="586.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">flow</text>
  <text x="940.0" y="600.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="middle">down</text>
  <text transform="translate(920 340) rotate(90)" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">resources and rules flow down</text>
  <rect x="180.0" y="94.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="190.0" y="116.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">EU AI Act: providers publish</text>
  <text x="190.0" y="133.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">a training data summary</text>
  <rect x="430.0" y="94.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="440.0" y="116.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Public debate on</text>
  <text x="440.0" y="133.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">AI and research integrity</text>
  <rect x="180.0" y="206.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="190.0" y="228.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Licenses restrict</text>
  <text x="190.0" y="245.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">documentation</text>
  <circle cx="385.0" cy="218.0" r="11" fill="#33322f"/>
  <text x="385.0" y="222.5" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="430.0" y="206.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="440.0" y="228.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Terms change</text>
  <text x="440.0" y="245.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">without notice</text>
  <rect x="180.0" y="318.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="190.0" y="340.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Licensed chatbot without</text>
