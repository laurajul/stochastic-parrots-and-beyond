  <text x="60.0" y="586.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">small</text>
  <text x="60.0" y="600.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="middle">and fast</text>
