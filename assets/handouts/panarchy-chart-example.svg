  <text x="190.0" y="469.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">AI guidance</text>
  <circle cx="385.0" cy="442.0" r="11" fill="#33322f"/>
  <text x="385.0" y="446.5" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="430.0" y="430.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="440.0" y="452.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Ethics board not</text>
  <text x="440.0" y="469.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">asked about AI use</text>
  <rect x="180.0" y="542.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="190.0" y="564.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">No disclosure</text>
  <text x="190.0" y="581.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">template</text>
  <rect x="430.0" y="542.0" width="220.0" height="56.0" rx="3" fill="#ffffff" stroke="#33322f" stroke-width="1"/>
  <text x="440.0" y="564.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Transcripts sent to</text>
  <text x="440.0" y="581.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">a hosted chatbot</text>
  <line x1="850.0" y1="476.0" x2="850.0" y2="330.0" stroke="#33322f" stroke-width="2" marker-end="url(#arrow)"/>
