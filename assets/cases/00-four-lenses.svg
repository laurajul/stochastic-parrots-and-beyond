<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Four lenses on one lifecycle</title>
  <desc id="desc">Grid with the six lifecycle stages as columns: design, data, training, deployment, evaluation, governance. Four rows show which stages each lens examines most. Scale and environment: data, training, deployment. Representation and Pygmalion: data, training, evaluation. Lifecycle and labor: all six stages. Political economy: design, deployment, governance. Original diagram, CC BY 4.0, Stochastic Parrots and Beyond.</desc>
