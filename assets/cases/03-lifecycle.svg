<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Six stages of the generative AI lifecycle: who works and who carries the risk</title>
  <desc id="desc">Six boxes in a row, connected by arrows: design, data, training, deployment, evaluation, governance. Under each box: who works and who carries the risk. Design: product teams and researchers work; future users carry the risk. Data: data creators, crawlers, and labelers work; people in the data and data workers carry the risk. Training: engineers and feedback workers work; feedback workers and local grids carry the risk. Deployment: providers and institutions work; users and people affected by outputs carry the risk. Evaluation: auditors and researchers work; groups that tests miss carry the risk. Governance: regulators and institutions work; the public carries the risk. A return arrow from governance to design shows that the cycle repeats. Original diagram, CC BY 4.0.</desc>
