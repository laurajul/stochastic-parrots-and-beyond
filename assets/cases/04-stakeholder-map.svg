  <text x="580.0" y="252.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">license fees</text>
  <line x1="430.0" y1="225.0" x2="430.0" y2="115.0" stroke="#33322f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="442.0" y="174.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">payment</text>
