<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Stakeholder and incentive map for an open-weight model</title>
  <desc id="desc">The model provider is in the centre. Cloud and hardware suppliers receive money from the provider and supply compute. Data creators supply data, often without consent. Data workers supply labeling work and receive wages through suppliers. Universities pay license fees to providers and set rules for researchers. Researchers send prompts and uploads to the provider. Research participants provide data to researchers. Regulators set rules for providers and universities. The public carries environmental costs. A legend explains three kinds of arrows: solid for money, dashed for data and work, dotted for rules. Original diagram, CC BY 4.0.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33322f"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="16.0" y="26.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Who gains, who pays: an open-weight model</text>
  <rect x="335.0" y="229.0" width="190.0" height="62.0" rx="6" fill="#33322f" stroke="#33322f" stroke-width="1.5"/>
  <text x="430.0" y="252.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Model provider</text>
  <text x="430.0" y="270.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#dcdbd6" text-anchor="middle">weights, license,</text>
  <text x="430.0" y="284.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#dcdbd6" text-anchor="middle">use policy</text>
  <rect x="335.0" y="49.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#33322f" stroke-width="1.5"/>
  <text x="430.0" y="72.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Cloud and hardware</text>
  <text x="430.0" y="90.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">compute, chips</text>
  <rect x="35.0" y="89.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#33322f" stroke-width="1.5"/>
  <text x="130.0" y="112.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Data creators</text>
  <text x="130.0" y="130.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">writers, artists,</text>
  <text x="130.0" y="144.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">photographers</text>
  <rect x="35.0" y="229.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#33322f" stroke-width="1.5"/>
  <text x="130.0" y="252.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Data workers</text>
  <text x="130.0" y="270.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">labeling, feedback,</text>
  <text x="130.0" y="284.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">moderation</text>
