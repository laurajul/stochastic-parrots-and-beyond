  <rect x="635.0" y="69.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#33322f" stroke-width="1.5"/>
  <text x="730.0" y="92.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Regulators</text>
  <text x="730.0" y="110.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">EU AI Act, law</text>
