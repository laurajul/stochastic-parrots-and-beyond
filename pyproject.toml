[project]
name = "stochastic-parrots-and-beyond"
version = "0.1.0"
description = "Open educational resources for the workshop Stochastic Parrots and Beyond: Normative Dimensions of Generative AI"
authors = [
    { name = "Moritz Mähr", email = "moritz.maehr@gmail.com" },
    { name = "Laura Wagner" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12",
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
